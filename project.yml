name: ScoreKeeper
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, ja, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.scorekeep
    APP_STORE_ID: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  ScoreKeeper:
    type: application
    platform: iOS
    sources: [ScoreKeeper, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ScoreKeeper AppStore
    info:
      path: ScoreKeeper/Info.plist
      properties:
        CFBundleDisplayName: Score Keeper
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        CFBundleURLTypes:
          - CFBundleURLName: com.hgsldswk.scorekeep
            CFBundleURLSchemes: [scorekeep]
  ScoreKeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ScoreKeeperTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  ScoreKeeperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ScoreKeeperUITests]
    dependencies:
      - target: ScoreKeeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ScoreKeeper
schemes:
  ScoreKeeper:
    build:
      targets:
        ScoreKeeper: all
        ScoreKeeperTests: [test]
    test:
      config: Debug
      targets: [ScoreKeeperTests]
  ScoreKeeperUI:
    build:
      targets:
        ScoreKeeper: all
        ScoreKeeperUITests: [test]
    test:
      config: Debug
      targets: [ScoreKeeperUITests]
